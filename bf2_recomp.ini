; ==============================================================================
; Star Wars: Battlefront II (2005) - Native PC Recompilation Configuration
; ==============================================================================

[Graphics]
; Aspect ratio: 16:9 (native widescreen), 4:3, 16:10, stretch
aspect=16:9

; Native Internal 3D Resolution Scale: 1 (640x480), 2 (1280x960 HD), 3 (1920x1440 QHD), 4 (2560x1920 4K)
res_scale=2

; Initial Window Scale: 2 (1280x720 at 16:9), 3 (1920x1080 at 16:9)
window_scale=2

; Start in borderless fullscreen: 0 = windowed (F11 or Alt+Enter toggles), 1 = fullscreen
fullscreen=0

; Texture Anisotropic Filtering level: 1 (off), 4, 8, 16 (max fidelity)
anisotropy=16

; AMD FidelityFX Contrast-Adaptive Sharpening (CAS) upscaler: 1 = enabled, 0 = disabled
cas=1

; Hardware Vertex Shader Acceleration: 1 = D3D11 GPU vertex shaders + HLSL JIT, 0 = CPU software loop
gpu_vsh=1

; Persistent On-Disk DXBC Shader Cache (eliminates shader compilation stutter): 1 = enabled, 0 = disabled
shader_cache=1

; Early-Z UAV Atomic Visibility Counting: 1 = GPU atomics (fastest), 0 = D3D11 query stalls
visibility_uav=1

; Asynchronous Pipelined Occlusion Resolution: 1 = non-blocking, 0 = synchronous flush
pipelined_query=1

; Parallel NV2A Pushbuffer KickOff Ack (overlaps game logic + GPU submission): 1 = enabled, 0 = disabled
pb_kick_ack=1

; Presentation VSync: 0 = unthrottled / low-latency, 1 = sync to monitor refresh rate
vsync=0

[Controls]
; Enable native PC Mouse and Keyboard controls: 1 = enabled, 0 = controller only
mouse_input=1

; Mouse aim sensitivity multiplier (default 1.0)
mouse_sens=1.0

; Mouse aim acceleration exponent (1.0 = linear / raw response, >1.0 = progressive curve)
mouse_acc=1.0

; Invert vertical aim axis: 0 = normal, 1 = inverted
mouse_invert_y=0

; Virtual stick deadzone compensation (0.0 to 0.9, default 0.18)
deadzone=0.18

[Kernel]
; Single-processor DISPATCH gate synchronization for APU and DPCs: 1 = enabled, 0 = disabled
dispatch_gate=1
